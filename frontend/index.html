<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L-ERAP PRO | 重庆劳动争议智能工作台</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600;700;800&family=Noto+Sans+SC:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        :root {
            --brand: #196ef7;
            --brand-soft: #aecbfe;
            --bg: #fbfcfe;
            --bg-alt: #edf5fe;
            --surface: #f7f8fc;
            --line: #e0e2eb;
            --ink: #2c2c36;
            --muted: #8f91a8;
            --white: #ffffff;
            --success: #1f8d65;
            --warn: #c27a1d;
            --danger: #d24b4b;
            --shadow: 0 24px 48px rgba(25, 68, 130, 0.06);
            --shadow-soft: 0 10px 24px rgba(25, 68, 130, 0.04);
            --radius-xl: 28px;
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --content: 1320px;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            color: var(--ink);
            font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            background:
                linear-gradient(180deg, rgba(237, 245, 254, 0.55), rgba(251, 252, 254, 0.98) 18%, rgba(251, 252, 254, 1) 100%);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(25, 110, 247, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(25, 110, 247, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.22), transparent 72%);
        }

        [v-cloak] {
            display: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
            transition:
                transform 180ms ease,
                background-color 180ms ease,
                border-color 180ms ease,
                box-shadow 180ms ease,
                color 180ms ease,
                opacity 180ms ease;
            touch-action: manipulation;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.56;
            transform: none;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 13px 14px;
            color: var(--ink);
            background: var(--white);
            outline: none;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.8;
        }

        input:focus,
        textarea:focus,
        select:focus,
        button:focus-visible,
        a:focus-visible {
            outline: none;
            border-color: rgba(25, 110, 247, 0.38);
            box-shadow: 0 0 0 4px rgba(25, 110, 247, 0.12);
        }

        .site-shell {
            min-height: 100vh;
            position: relative;
            z-index: 0;
        }

        .topbar,
        .assistant-topbar,
        .section,
        .footer-inner,
        .assistant-layout {
            width: min(calc(100% - 48px), var(--content));
            margin: 0 auto;
        }

        .topbar {
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .brand-lockup,
        .brand-line {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand-mark {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background:
                linear-gradient(135deg, rgba(25, 110, 247, 0.14), rgba(25, 110, 247, 0.08));
            border: 1px solid rgba(25, 110, 247, 0.14);
            color: var(--brand);
            font-family: "Manrope", sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 0.12em;
        }

        .brand-copy strong,
        .assistant-brand strong {
            display: block;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.02em;
        }

        .brand-copy span,
        .assistant-brand span,
        .muted,
        .helper {
            color: var(--muted);
        }

        .nav-links,
        .topbar-actions,
        .hero-actions,
        .capability-actions,
        .toolbar-actions,
        .auth-actions,
        .workspace-actions,
        .doc-actions,
        .pill-row,
        .progress-list,
        .cases-list,
        .activity-list,
        .reference-list,
        .news-grid,
        .footer-grid {
            display: flex;
            gap: 12px;
        }

        .nav-links {
            align-items: center;
        }

        .nav-link {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 14px;
            padding: 10px 12px;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--ink);
        }

        .btn {
            min-height: 46px;
            padding: 0 22px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--white);
            color: var(--ink);
            font-weight: 600;
        }

        .btn.primary {
            border-color: transparent;
            background: var(--brand);
            color: var(--white);
            box-shadow: 0 14px 28px rgba(25, 110, 247, 0.18);
        }

        .btn.soft {
            background: rgba(174, 203, 254, 0.24);
            color: var(--brand);
            border-color: rgba(174, 203, 254, 0.4);
        }

        .btn.ghost {
            background: transparent;
        }

        .btn.danger {
            color: var(--danger);
            border-color: rgba(210, 75, 75, 0.18);
            background: rgba(210, 75, 75, 0.04);
        }

        .icon-round {
            width: 54px;
            height: 54px;
            border-radius: 999px;
            border: 1px solid rgba(174, 203, 254, 0.42);
            background: rgba(174, 203, 254, 0.22);
            display: grid;
            place-items: center;
            color: var(--brand);
            box-shadow: var(--shadow-soft);
        }

        .icon-round svg,
        .mini-icon svg,
        .ghost-arrow svg {
            width: 18px;
            height: 18px;
        }

        .hero {
            padding: 42px 0 110px;
        }

        .hero-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(440px, 0.95fr);
            gap: 48px;
            align-items: center;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--brand);
            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.18em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            content: "";
            width: 34px;
            height: 1px;
            background: rgba(25, 110, 247, 0.42);
        }

        .hero h1,
        .section-title,
        .cta-panel h2 {
            margin: 24px 0 0;
            font-size: clamp(58px, 6vw, 82px);
            line-height: 1.05;
            letter-spacing: -0.04em;
            font-weight: 700;
        }

        .hero h1 span,
        .section-title span {
            color: var(--brand);
        }

        .english-subtitle {
            margin: 18px 0 0;
            font-family: "Manrope", sans-serif;
            font-size: clamp(24px, 3vw, 40px);
            line-height: 1.2;
            font-weight: 200;
            letter-spacing: 0.04em;
            color: rgba(44, 44, 54, 0.78);
        }

        .hero-copy p,
        .section-copy p,
        .cta-panel p,
        .card p,
        .news-card p,
        .featured-card p {
            margin: 18px 0 0;
            color: var(--muted);
            line-height: 1.9;
            font-size: 15px;
        }

        .hero-actions {
            margin-top: 32px;
            align-items: center;
        }

        .hero-metrics {
            margin-top: 48px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
        }

        .metric {
            min-height: 124px;
            padding: 22px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.78);
            box-shadow: var(--shadow-soft);
        }

        .metric strong {
            display: block;
            font-family: "Manrope", sans-serif;
            font-size: 30px;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--brand);
        }

        .metric span {
            display: block;
            margin-top: 10px;
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
        }

        .hero-visual {
            position: relative;
            min-height: 680px;
            padding: 28px;
            border-radius: 36px;
            background:
                linear-gradient(180deg, rgba(237, 245, 254, 0.92), rgba(255, 255, 255, 0.96)),
                linear-gradient(90deg, rgba(25, 110, 247, 0.04) 1px, transparent 1px),
                linear-gradient(rgba(25, 110, 247, 0.04) 1px, transparent 1px);
            background-size: auto, 24px 24px, 24px 24px;
            border: 1px solid rgba(25, 110, 247, 0.12);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .paper {
            position: absolute;
            border-radius: 26px;
            border: 1px solid rgba(25, 110, 247, 0.12);
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 28px 48px rgba(18, 62, 119, 0.08);
        }

        .paper.hero-main {
            inset: 90px 56px 76px 90px;
            padding: 38px;
            transform: rotate(-3deg);
        }

        .paper.side-note {
            top: 48px;
            right: 18px;
            width: 210px;
            padding: 18px;
            transform: rotate(8deg);
        }

        .paper.summary-card {
            left: 26px;
            bottom: 26px;
            width: 250px;
            padding: 18px;
            transform: rotate(-9deg);
        }

        .doc-bar,
        .doc-line {
            display: block;
            border-radius: 999px;
        }

        .doc-bar {
            width: 120px;
            height: 12px;
            background: rgba(25, 110, 247, 0.14);
        }

        .doc-line {
            width: 100%;
            height: 10px;
            margin-top: 12px;
            background: #eef1f7;
        }

        .doc-line.short {
            width: 62%;
        }

        .doc-highlight {
            display: grid;
            grid-template-columns: 1.35fr 0.65fr;
            gap: 18px;
            margin-top: 24px;
        }

        .doc-column,
        .doc-panel {
            border-radius: 22px;
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 18px;
        }

        .doc-panel.blue {
            background: rgba(174, 203, 254, 0.22);
            border-color: rgba(25, 110, 247, 0.12);
        }

        .doc-chip {
            display: inline-flex;
            align-items: center;
            min-height: 30px;
            padding: 0 12px;
            border-radius: 999px;
            background: rgba(25, 110, 247, 0.1);
            color: var(--brand);
            font-size: 12px;
            font-weight: 700;
        }

        .doc-grid-mini {
            margin-top: 18px;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .mini-tile {
            border-radius: 18px;
            border: 1px solid var(--line);
            background: var(--white);
            padding: 14px;
        }

        .mini-tile strong,
        .card h3,
        .news-card h3,
        .featured-card h3,
        .case-item strong,
        .activity-item strong,
        .reference-item strong,
        .section-copy strong {
            display: block;
        }

        .mini-tile span {
            display: block;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.7;
        }

        .floating-tiles {
            position: absolute;
            right: 34px;
            bottom: 44px;
            display: grid;
            gap: 14px;
        }

        .float-tile {
            min-width: 210px;
            padding: 14px 16px;
            border-radius: 18px;
            border: 1px solid rgba(25, 110, 247, 0.14);
            background: rgba(255, 255, 255, 0.88);
            box-shadow: var(--shadow-soft);
        }

        .float-tile strong {
            font-size: 14px;
        }

        .float-tile span {
            display: block;
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.7;
        }

        .section {
            padding: 88px 0;
        }

        .section-head {
            max-width: 760px;
            margin: 0 auto 54px;
            text-align: center;
        }

        .section-title {
            font-size: clamp(46px, 5vw, 76px);
        }

        .capability {
            display: grid;
            grid-template-columns: minmax(0, 0.95fr) minmax(440px, 1.05fr);
            gap: 40px;
            align-items: center;
            min-height: 520px;
        }

        .capability + .capability {
            margin-top: 64px;
        }

        .capability.alt {
            grid-template-columns: minmax(440px, 1.05fr) minmax(0, 0.95fr);
        }

        .section-copy {
            max-width: 420px;
        }

        .section-copy strong {
            font-size: 14px;
            color: var(--brand);
            letter-spacing: 0.12em;
        }

        .section-copy h3 {
            margin: 18px 0 0;
            font-size: 40px;
            line-height: 1.18;
            letter-spacing: -0.03em;
        }

        .points {
            margin: 26px 0 0;
            padding: 0;
            list-style: none;
        }

        .points li {
            position: relative;
            padding-left: 20px;
            margin-top: 12px;
            color: var(--muted);
            line-height: 1.85;
        }

        .points li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 12px;
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--brand);
        }

        .capability-stage {
            position: relative;
            min-height: 420px;
            border-radius: 34px;
            border: 1px solid var(--line);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 248, 252, 0.9));
            box-shadow: var(--shadow-soft);
            overflow: hidden;
        }

        .stage-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(25, 110, 247, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(25, 110, 247, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        .stage-paper {
            position: absolute;
            border-radius: 24px;
            border: 1px solid rgba(25, 110, 247, 0.12);
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 22px 34px rgba(25, 68, 130, 0.07);
            padding: 20px;
        }

        .stage-paper.large {
            left: 42px;
            top: 48px;
            right: 74px;
            bottom: 52px;
        }

        .stage-paper.note {
            width: 170px;
            top: 28px;
            right: 28px;
            transform: rotate(7deg);
        }

        .stage-paper.badge {
            left: 28px;
            bottom: 28px;
            width: 180px;
            transform: rotate(-7deg);
        }

        .panel-split {
            display: grid;
            grid-template-columns: 1fr 190px;
            gap: 18px;
            height: 100%;
        }

        .stacked-lines {
            display: grid;
            gap: 10px;
        }

        .stacked-lines div {
            height: 10px;
            border-radius: 999px;
            background: #edf1f8;
        }

        .stacked-lines div:nth-child(1) {
            width: 54%;
            background: rgba(25, 110, 247, 0.16);
        }

        .stacked-lines div:nth-child(4) {
            width: 72%;
        }

        .stacked-lines div:nth-child(5) {
            width: 65%;
        }

        .stage-box {
            border-radius: 20px;
            border: 1px solid var(--line);
            background: var(--surface);
            padding: 16px;
        }

        .stage-box + .stage-box {
            margin-top: 14px;
        }

        .news-section {
            background: rgba(237, 245, 254, 0.72);
        }

        .featured-card {
            padding: 28px;
            border-radius: 28px;
            border: 1px solid var(--line);
            background: var(--white);
            box-shadow: var(--shadow-soft);
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 24px;
            align-items: center;
        }

        .featured-art,
        .news-art {
            border-radius: 22px;
            border: 1px solid rgba(25, 110, 247, 0.1);
            background:
                linear-gradient(180deg, rgba(174, 203, 254, 0.24), rgba(255, 255, 255, 0.95));
            min-height: 220px;
            position: relative;
            overflow: hidden;
        }

        .featured-art::before,
        .news-art::before {
            content: "";
            position: absolute;
            inset: 22px;
            border-radius: 20px;
            border: 1px solid rgba(25, 110, 247, 0.1);
            background:
                linear-gradient(rgba(25, 110, 247, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(25, 110, 247, 0.04) 1px, transparent 1px),
                rgba(255, 255, 255, 0.94);
            background-size: 24px 24px, 24px 24px, auto;
        }

        .news-grid {
            margin-top: 22px;
            align-items: stretch;
        }

        .news-card {
            flex: 1 1 0;
            padding: 20px;
            border-radius: 22px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.9);
            box-shadow: var(--shadow-soft);
        }

        .news-art {
            min-height: 160px;
            margin-bottom: 18px;
        }

        .news-meta {
            display: inline-flex;
            min-height: 28px;
            align-items: center;
            padding: 0 12px;
            border-radius: 999px;
            background: rgba(25, 110, 247, 0.08);
            color: var(--brand);
            font-family: "Manrope", sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
        }

        .cta-panel {
            padding: 54px 58px;
            border-radius: 32px;
            border: 1px solid rgba(25, 110, 247, 0.12);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(237, 245, 254, 0.86));
            box-shadow: var(--shadow-soft);
            text-align: center;
        }

        .cta-panel h2 {
            font-size: clamp(42px, 4vw, 66px);
        }

        .cta-panel .hero-actions {
            justify-content: center;
        }

        footer {
            border-top: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.68);
        }

        .footer-inner {
            padding: 36px 0 44px;
        }

        .footer-grid {
            justify-content: space-between;
            align-items: flex-start;
        }

        .footer-col {
            max-width: 260px;
        }

        .footer-col strong {
            display: block;
            margin-bottom: 14px;
        }

        .footer-col span,
        .footer-col a,
        .copyright {
            display: block;
            margin-top: 8px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        .copyright {
            margin-top: 28px;
        }

        .assistant-topbar {
            height: 86px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        .assistant-topbar-wrap {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: blur(18px);
            background: rgba(251, 252, 254, 0.82);
            border-bottom: 1px solid rgba(224, 226, 235, 0.9);
        }

        .assistant-layout {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr) 340px;
            gap: 22px;
            padding: 28px 0 40px;
            align-items: start;
        }

        .assistant-rail,
        .assistant-stage,
        .assistant-side {
            display: grid;
            gap: 18px;
        }

        .card {
            border-radius: 24px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.92);
            box-shadow: var(--shadow-soft);
            padding: 22px;
        }

        .card h3 {
            margin: 0;
            font-size: 20px;
            letter-spacing: -0.02em;
        }

        .card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            margin-bottom: 18px;
        }

        .headline-card {
            padding: 30px;
            background:
                linear-gradient(180deg, rgba(237, 245, 254, 0.9), rgba(255, 255, 255, 0.96));
        }

        .headline-card h1 {
            margin: 12px 0 0;
            font-size: 38px;
            line-height: 1.12;
            letter-spacing: -0.04em;
        }

        .assistant-metrics {
            margin-top: 28px;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .mini-card {
            min-height: 104px;
            padding: 16px;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: rgba(255, 255, 255, 0.86);
        }

        .mini-card strong {
            display: block;
            margin-top: 16px;
            font-family: "Manrope", sans-serif;
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.04em;
            color: var(--brand);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
        }

        .helper-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-top: 8px;
        }

        .field + .field {
            margin-top: 14px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
            color: rgba(44, 44, 54, 0.92);
        }

        .pill-row {
            flex-wrap: wrap;
        }

        .pill {
            min-height: 34px;
            padding: 0 14px;
            border-radius: 999px;
            border: 1px solid rgba(174, 203, 254, 0.46);
            background: rgba(174, 203, 254, 0.16);
            color: var(--brand);
            font-size: 12px;
            font-weight: 700;
        }

        .pill.active {
            border-color: var(--brand);
            background: var(--brand);
            color: var(--white);
        }

        .status {
            display: inline-flex;
            align-items: center;
            min-height: 32px;
            padding: 0 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
        }

        .status.ok {
            color: var(--success);
            background: rgba(31, 141, 101, 0.08);
        }

        .status.warn {
            color: var(--warn);
            background: rgba(194, 122, 29, 0.1);
        }

        .status.danger {
            color: var(--danger);
            background: rgba(210, 75, 75, 0.08);
        }

        .surface-note {
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: var(--surface);
            font-size: 13px;
            color: var(--muted);
            line-height: 1.8;
        }

        .feedback {
            margin-top: 14px;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.8;
        }

        .feedback.success {
            color: var(--success);
            background: rgba(31, 141, 101, 0.08);
            border: 1px solid rgba(31, 141, 101, 0.12);
        }

        .feedback.error {
            color: var(--danger);
            background: rgba(210, 75, 75, 0.08);
            border: 1px solid rgba(210, 75, 75, 0.12);
        }

        .cases-list,
        .activity-list,
        .reference-list,
        .progress-list {
            flex-direction: column;
        }

        .case-item,
        .activity-item,
        .reference-item,
        .progress-item {
            padding: 16px;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: var(--surface);
        }

        .case-item {
            display: grid;
            gap: 10px;
        }

        .case-item small,
        .activity-item small,
        .reference-item small,
        .progress-item small {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.7;
        }

        .case-actions {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .text-btn {
            border: 0;
            padding: 0;
            background: transparent;
            color: var(--brand);
            font-size: 13px;
            font-weight: 600;
        }

        .claim-list,
        .question-list,
        .evidence-list,
        .suggestion-list {
            margin: 0;
            padding-left: 20px;
        }

        .claim-list li,
        .question-list li,
        .evidence-list li,
        .suggestion-list li {
            margin-top: 10px;
            color: var(--muted);
            line-height: 1.8;
        }

        .summary-block,
        .document-block {
            padding: 18px;
            border-radius: 18px;
            border: 1px solid var(--line);
            background: var(--surface);
        }

        .summary-block strong,
        .document-block strong {
            display: block;
            font-size: 14px;
            color: var(--ink);
        }

        .summary-block p,
        .document-block pre {
            margin: 12px 0 0;
            color: var(--muted);
            line-height: 1.9;
        }

        .document-block pre {
            white-space: pre-wrap;
            font-family: "Noto Sans SC", "PingFang SC", sans-serif;
            font-size: 14px;
        }

        .ghost-arrow {
            width: 34px;
            height: 34px;
            border-radius: 999px;
            border: 1px solid rgba(25, 110, 247, 0.14);
            background: var(--white);
            display: grid;
            place-items: center;
            color: var(--brand);
        }

        .progress-item {
            display: grid;
            gap: 10px;
        }

        .progress-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .loader {
            width: 18px;
            height: 18px;
            border-radius: 999px;
            border: 2px solid rgba(25, 110, 247, 0.16);
            border-top-color: var(--brand);
            animation: spin 0.8s linear infinite;
        }

        .hidden {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes float-up {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-copy,
        .hero-visual,
        .section-head,
        .capability,
        .news-card,
        .featured-card,
        .card {
            animation: float-up 420ms ease both;
        }
    </style>
</head>

                    <template v-else>

                            <button class="pill" :class="{ active: authMode === 'register' }" type="button" @click="authMode = 'register'">注册</button>

                            <label for="auth-email">邮箱</label>

                        </div>
                        <div class="field">
                            <label for="auth-password">密码</label>
                            <input id="auth-password" v-model="authForm.password" type="password" placeholder="至少 8 位">

                        <div class="field" v-if="authMode === 'register'">
                            <label for="auth-name">姓名</label>
                            <input id="auth-name" v-model.trim="authForm.full_name" type="text" placeholder="张三">
                        </div>
                        <div class="field" v-if="authMode === 'register'">
                            <label for="auth-role">角色</label>
                            <input id="auth-role" v-model.trim="authForm.role" type="text" placeholder="案件申请人">

                        <div class="auth-actions" style="margin-top: 16px;">
                            <button class="btn primary" type="button" @click="submitAuth" :disabled="loading">
                                {{ authMode === 'login' ? '登录进入工作台' : '注册并进入工作台' }}

                        </div>
                    </template>
                </section>

                <section class="card">
                    <div class="card-head">
                        <div>
                            <h3>我的案件</h3>
                            <p>已登录后可保存、恢复和删除案件快照。</p>
                        </div>
                        <button class="text-btn" type="button" @click="loadCases" :disabled="!user || loading">刷新</button>

                    <div class="cases-list" v-if="cases.length">

                                <small>{{ item.case_type || '劳动争议' }}</small>
                                <small style="display: block; margin-top: 6px;">{{ item.primary_finding || '待补充研判摘要' }}</small>

                            <div class="case-actions">
                                <button class="text-btn" type="button" @click="openCase(item.id)">恢复</button>
                                <button class="text-btn" type="button" @click="removeCase(item.id)">删除</button>
                            </div>
                        </article>
                    </div>
                    <div class="surface-note" v-else>还没有已保存案件。登录后在当前工作台点击“保存案件”即可写入服务端。</div>

                <section class="card">
                    <div class="card-head">
                        <div>
                            <h3>活动记录</h3>
                            <p>用于回看最近的登录、保存和更新动作。</p>
                        </div>
                    </div>
                    <div class="activity-list" v-if="activities.length">
                        <article class="activity-item" v-for="item in activities" :key="item.id">
                            <strong>{{ item.title }}</strong>
                            <small>{{ item.detail }}</small>
                            <small>{{ formatDate(item.created_at) }}</small>
                        </article>
                    </div>
                    <div class="surface-note" v-else>登录后这里会出现服务端返回的个人活动流。</div>
                </section>
            </aside>

            <section class="assistant-stage">
                <section class="card headline-card">
                    <div class="eyebrow">Workbench</div>
                    <h1>把案情、证据、文书与本地依据放进同一块工作面板</h1>
                    <p>当前版本优先把桌面网页跑通。直接调用现有后端接口，不再延续旧前端布局。你可以从事实输入开始，一次完成研判、文书生成与案件保存。</p>
                    <div class="assistant-metrics">
                        <article class="mini-card">
                            <span class="muted">风险等级</span>
                            <strong>{{ riskLevelLabel }}</strong>
                        </article>
                        <article class="mini-card">
                            <span class="muted">成功率</span>
                            <strong>{{ successLabel }}</strong>
                        </article>
                        <article class="mini-card">
                            <span class="muted">工作阶段</span>
                            <strong style="font-size: 22px;">{{ stageLabel }}</strong>
                        </article>
                    </div>
                </section>

                <section class="card">
                    <div class="card-head">
                        <div>
                            <h3>案件输入</h3>
                            <p>先整理能确定的事实，再让系统告诉你还缺什么。</p>
                        </div>
                        <div class="pill-row">
                            <button class="pill" type="button" @click="applySample('salary')">工资拖欠示例</button>
                            <button class="pill" type="button" @click="applySample('dismissal')">违法解除示例</button>
                            <button class="pill" type="button" @click="applySample('overtime')">加班费示例</button>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="field">
                            <label for="case-type">案件类型</label>
                            <input id="case-type" v-model.trim="caseForm.case_type" type="text" placeholder="例如：工资报酬纠纷">
                        </div>
                        <div class="field">
                            <label for="case-goal">核心诉求</label>
                            <input id="case-goal" v-model.trim="caseForm.goal" type="text" placeholder="例如：补发工资并支付加班费">
                        </div>
                    </div>

                    <div class="field">
                        <label for="case-facts">案情事实</label>
                        <textarea id="case-facts" v-model.trim="caseForm.facts" placeholder="按时间顺序写清楚入职、岗位、工资、争议经过、解除或欠薪节点、现有证据与当前诉求。"></textarea>
                    </div>

                    <div class="field">
                        <label for="case-evidence">证据材料</label>
                        <textarea id="case-evidence" v-model.trim="caseForm.evidenceText" placeholder="每行一项，例如：劳动合同、工资流水、考勤记录、聊天记录、解除通知。"></textarea>
                    </div>

                    <div class="grid-3">
                        <div class="field">
                            <label for="applicant-name">申请人姓名</label>
                            <input id="applicant-name" v-model.trim="caseForm.applicant_name" type="text" placeholder="张三">
                        </div>
                        <div class="field">
                            <label for="employer-name">单位名称</label>
                            <input id="employer-name" v-model.trim="caseForm.employer_name" type="text" placeholder="重庆某科技公司">
                        </div>
                        <div class="field">
                            <label for="salary">月工资</label>
                            <input id="salary" v-model.trim="caseForm.salary" type="number" min="0" step="100" placeholder="12000">
                        </div>
                    </div>

                    <div class="grid-3">
                        <div class="field">
                            <label for="years">工作年限</label>
                            <input id="years" v-model.trim="caseForm.years" type="number" min="0" step="0.1" placeholder="2.2">
                        </div>
                        <div class="field">
                            <label for="contact-name">联系人</label>
                            <input id="contact-name" v-model.trim="caseForm.contact_name" type="text" placeholder="张三">
                        </div>
                        <div class="field">
                            <label for="contact-phone">联系电话</label>
                            <input id="contact-phone" v-model.trim="caseForm.contact_phone" type="text" placeholder="13800000000">
                        </div>
                    </div>

                    <div class="workspace-actions" style="margin-top: 18px;">
                        <button class="btn primary" type="button" @click="runWorkup" :disabled="loading">开始研判</button>
                        <button class="btn soft" type="button" @click="saveCase" :disabled="loading">保存案件</button>
                        <button class="btn ghost" type="button" @click="resetWorkspace" :disabled="loading">重置输入</button>
                    </div>
                    <div class="helper-row">
                        <span class="helper">工作台会调用 `/arbitration/workup`、`/generate-document`、`/validate-document` 和 `/local-references`。</span>
                    </div>
                    <div v-if="notice" class="feedback success">{{ notice }}</div>
                    <div v-if="error" class="feedback error">{{ error }}</div>
                </section>

                <section class="card">
                    <div class="card-head">
                        <div>
                            <h3>研判结果</h3>
                            <p>这里展示摘要、缺失问题、诉求拆解、证据清单与服务建议。</p>
                        </div>
                        <span class="status" :class="statusClass">{{ stageLabel }}</span>
                    </div>

                    <template v-if="workup">
                        <div class="summary-block">
                            <strong>案件摘要</strong>
                            <p>{{ workup.analysis.summary || '暂无摘要。' }}</p>
                        </div>

                        <div class="grid-2" style="margin-top: 16px;">
                            <div class="summary-block">
                                <strong>核心结论</strong>
                                <p>{{ primaryFinding }}</p>
                            </div>
                            <div class="summary-block">
                                <strong>下一步动作</strong>
                                <p>{{ nextBestAction }}</p>
                            </div>
                        </div>

                        <div class="grid-2" style="margin-top: 16px;">
                            <div class="summary-block">
                                <strong>待补问题</strong>
                                <ol class="question-list">
                                    <li v-for="item in missingQuestions" :key="item">{{ item }}</li>
                                </ol>
                            </div>
                            <div class="summary-block">
                                <strong>建议文书</strong>
                                <div class="pill-row" style="margin-top: 14px;">
                                    <button
                                        v-for="item in suggestedDocuments"
                                        :key="item"
                                        class="pill"
                                        :class="{ active: selectedDocumentType === item }"
                                        type="button"
                                        @click="selectedDocumentType = item"
                                    >
                                        {{ item }}
                                    </button>
                                </div>
                                <ul class="suggestion-list" style="margin-top: 16px;">
                                    <li v-for="item in serviceNotes" :key="item">{{ item }}</li>
                                </ul>
                            </div>
                        </div>

                        <div class="grid-2" style="margin-top: 16px;">
                            <div class="summary-block">
                                <strong>诉求拆解</strong>
                                <ul class="claim-list">
                                    <li v-for="item in claimItems" :key="item.name">{{ item.name }}：{{ item.calculation || item.basis || '待进一步核算' }}</li>
                                </ul>
                            </div>
                            <div class="summary-block">
                                <strong>证据目录</strong>
                                <ul class="evidence-list">
                                    <li v-for="item in evidenceChecklist" :key="item.label || item.name">{{ item.label || item.name || item }}</li>
                                </ul>
                            </div>
                        </div>
                    </template>

                    <div class="surface-note" v-else>还没有返回研判结果。先在上方输入案情并点击“开始研判”。</div>
                </section>

                <section class="card">
                    <div class="card-head">
                        <div>
                            <h3>文书草稿</h3>
                            <p>从研判结果直接切入申请书草稿与一致性校验。</p>
                        </div>
                        <div class="doc-actions">
                            <button class="btn primary" type="button" @click="generateDocument" :disabled="loading">生成文书</button>
                            <button class="btn soft" type="button" @click="validateDocument" :disabled="loading || !documentDraft">校验文书</button>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="field">
                            <label for="document-type">文书类型</label>
                            <select id="document-type" v-model="selectedDocumentType">
                                <option v-for="item in documentOptions" :key="item" :value="item">{{ item }}</option>
                            </select>
                        </div>
                        <div class="surface-note">
                            默认优先使用研判返回的建议文书类型。也可手动切换为仲裁申请书或庭前调解申请书。
                        </div>
                    </div>

                    <template v-if="documentDraft">
                        <div class="document-block" style="margin-top: 16px;">
                            <strong>{{ documentDraft.document_type }}</strong>
                            <pre>{{ documentDraft.content }}</pre>
                        </div>
                    </template>
                    <div class="surface-note" v-else style="margin-top: 16px;">还没有生成文书草稿。</div>

                    <template v-if="validation">
                        <div class="grid-2" style="margin-top: 16px;">
                            <div class="summary-block">
                                <strong>校验状态</strong>
                                <p>{{ validation.is_valid ? '校验通过，仍建议人工复核。' : '发现需要修正的问题，请先处理。' }}</p>
                                <ul class="suggestion-list" style="margin-top: 16px;">
                                    <li v-for="item in validation.issues" :key="`issue-${item}`">{{ item }}</li>
                                    <li v-for="item in validation.warnings" :key="`warning-${item}`">{{ item }}</li>
                                </ul>
                            </div>
                            <div class="summary-block">
                                <strong>修订建议</strong>
                                <ul class="suggestion-list">
                                    <li v-for="item in validation.suggestions" :key="item">{{ item }}</li>
                                </ul>
                            </div>
                        </div>
                    </template>
                </section>
            </section>

            <aside class="assistant-side">
                <section class="card">
                    <div class="card-head">
                        <div>
                            <h3>流程进度</h3>
                            <p>显示后端返回的 pipeline 状态和摘要。</p>
                        </div>
                    </div>
                    <div class="progress-list" v-if="pipelineSteps.length">
                        <article class="progress-item" v-for="item in pipelineSteps" :key="item.name">
                            <div class="progress-head">
                                <strong>{{ pipelineName(item.name) }}</strong>
                                <span class="status ok">{{ item.status || 'ok' }}</span>
                            </div>
                            <small>{{ item.summary || '已完成。' }}</small>
                            <small>{{ item.elapsed_ms }} ms</small>
                        </article>
                    </div>
                    <div class="surface-note" v-else>开始研判后，这里会展示案件分析、成本估算、本地依据等步骤状态。</div>
                </section>

                <section class="card">
                    <div class="card-head">
                        <div>
                            <h3>重庆本地依据</h3>
                            <p>来自 `/arbitration/local-references` 或 workup 聚合结果。</p>
                        </div>
                    </div>
                    <div class="reference-list" v-if="referenceItems.length">
                        <article class="reference-item" v-for="item in referenceItems" :key="`${item.title}-${item.source}`">
                            <strong>{{ item.title }}</strong>
                            <small>{{ item.source || '重庆公开资料' }}</small>
                            <small>{{ item.summary || item.raw || '暂无摘要。' }}</small>
                        </article>
                    </div>
                    <div class="surface-note" v-else>研判完成后会自动带出本地参考摘要；也可以点击顶部“刷新本地依据”。</div>
                </section>

                <section class="card">
                    <div class="card-head">
                        <div>
                            <h3>服务边界</h3>
                            <p>保持页面专业和可信，同时明确产品边界。</p>
                        </div>
                    </div>
                    <div class="surface-note">本系统只提供劳动仲裁准备信息和草稿辅助，不替代正式法律意见。涉及时效、工伤待遇、解除合法性和较大金额争议时，应由具备资质的律师复核。</div>
                </section>
            </aside>
        </main>
    </template>
</div>

<script>
const { createApp } = Vue;

const sampleCases = {
    salary: {
        case_type: "工资报酬纠纷",
        goal: "补发拖欠工资并支付加班费",
        facts: "申请人自 2023 年 3 月起在重庆某科技公司从事运营工作，月工资 12000 元。2025 年 2 月至 4 月公司连续拖欠工资，期间仍安排晚间加班和周末值班，但没有支付加班费。申请人多次通过企业微信和邮件催要，公司仅口头承诺后续补发。现申请人希望主张拖欠工资、加班费，并要求明确公司支付时间。",
        evidenceText: "劳动合同\n工资流水\n企业微信聊天记录\n邮件催款记录\n考勤截图",
        applicant_name: "张三",
        employer_name: "重庆某科技公司",
        salary: "12000",
        years: "2.2",
        contact_name: "张三",
        contact_phone: "13800000000"
    },
    dismissal: {
        case_type: "违法解除纠纷",
        goal: "确认违法解除并主张赔偿金",
        facts: "申请人于 2022 年入职重庆某互联网公司，担任产品经理，月工资 18000 元。2025 年 4 月公司以组织调整为由要求立即离职，但未提前通知，也未提供书面解除通知和经济补偿。申请人手中有劳动合同、绩效记录、工资流水和沟通录音，希望确认解除违法并主张赔偿金。",
        evidenceText: "劳动合同\n工资流水\n绩效记录\n会议录音\n聊天记录",
        applicant_name: "李四",
        employer_name: "重庆某互联网公司",
        salary: "18000",
        years: "3.1",
        contact_name: "李四",
        contact_phone: "13900000000"
    },
    overtime: {
        case_type: "加班费纠纷",
        goal: "主张平日与休息日加班费",
        facts: "申请人长期在重庆某制造企业从事技术支持工作，月工资 9500 元。公司自 2024 年起持续安排夜间加班和周末值班，但没有按照法律规定支付加班费，也未安排补休。申请人保留了考勤记录、排班表、门禁记录和工资流水，希望核算完整的加班费请求金额。",
        evidenceText: "考勤记录\n排班表\n门禁记录\n工资流水\n聊天记录",
        applicant_name: "王五",
        employer_name: "重庆某制造企业",
        salary: "9500",
        years: "1.8",
        contact_name: "王五",
        contact_phone: "13700000000"
    }
};

function parseEvidence(text) {
    return String(text || "")
        .split(/\n|,|，|、/)
        .map(item => item.trim())
        .filter(Boolean);
}

function normalizeRoute(pathname) {
    return pathname === "/assistant" ? "assistant" : "home";
}

createApp({
    data() {
        return {
            currentRoute: normalizeRoute(window.location.pathname),
            loading: false,
            notice: "",
            error: "",
            user: null,
            authMode: "login",
            authForm: {
                email: "",
                password: "",
                full_name: "",
                role: "案件申请人"
            },
            caseForm: {
                case_type: "",
                goal: "",
                facts: "",
                evidenceText: "",
                applicant_name: "",
                employer_name: "",
                salary: "",
                years: "",
                contact_name: "",
                contact_phone: ""
            },
            workup: null,
            documentDraft: null,
            validation: null,
            references: [],
            cases: [],
            activities: [],
            selectedDocumentType: "仲裁申请书",
            defaultDocuments: ["仲裁申请书", "庭前调解申请书", "证据清单"]
        };
    },
    computed: {
        riskLevelLabel() {
            return this.workup?.analysis?.risk_level || "待研判";
        },
        successLabel() {
            return this.workup?.success_prediction?.success_probability || "待评估";
        },
        stageLabel() {
            return this.workup?.workflow_stage || "待开始";
        },
        statusClass() {
            if (!this.workup) return "warn";
            if (this.stageLabel.includes("补充")) return "warn";
            if (String(this.riskLevelLabel).includes("高")) return "danger";
            return "ok";
        },
        missingQuestions() {
            return this.workup?.intake?.missing_questions || [];
        },
        claimItems() {
            return this.workup?.analysis?.claim_items || [];
        },
        evidenceChecklist() {
            return this.workup?.analysis?.evidence_checklist || this.workup?.intake?.evidence_checklist || [];
        },
        suggestedDocuments() {
            return this.workup?.suggested_documents?.length ? this.workup.suggested_documents : this.defaultDocuments;
        },
        documentOptions() {
            return Array.from(new Set([...this.defaultDocuments, ...this.suggestedDocuments]));
        },
        pipelineSteps() {
            return this.workup?.pipeline_status || [];
        },
        referenceItems() {
            return this.references.length ? this.references : (this.workup?.local_references || []);
        },
        serviceNotes() {
            return this.workup?.service_recommendation?.compliance_notes || [
                "本系统提供劳动仲裁准备信息，不替代正式法律意见。",
                "涉及时效、工伤和较大金额争议时，应由律师复核。"
            ];
        },
        primaryFinding() {
            const summary = this.workup?.analysis?.summary || "";
            return summary ? summary.split("。")[0] + "。" : "等待系统生成案件摘要。";
        },
        nextBestAction() {
            return this.workup?.service_recommendation?.next_best_action || "先输入案情并开始研判。";
        }
    },
    mounted() {
        window.addEventListener("popstate", this.handlePopState);
        this.fetchSession();
    },
    beforeUnmount() {
        window.removeEventListener("popstate", this.handlePopState);
    },
    methods: {
        handlePopState() {
            this.currentRoute = normalizeRoute(window.location.pathname);
            this.notice = "";
            this.error = "";
        },
        scrollToSection(id) {
            if (this.currentRoute !== "home") {
                this.goHome(() => {
                    requestAnimationFrame(() => this.scrollToSection(id));
                });
                return;
            }
            const target = document.getElementById(id);
            if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
        },
        goHome(callback = null) {
            history.pushState({}, "", "/");
            this.currentRoute = "home";
            if (typeof callback === "function") callback();
        },
        goAssistant() {
            history.pushState({}, "", "/assistant");
            this.currentRoute = "assistant";
            this.notice = "";
            this.error = "";
            if (this.user) this.loadWorkspaceData();
        },
        formatDate(value) {
            if (!value) return "";
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return value;
            return date.toLocaleString("zh-CN", { hour12: false });
        },
        pipelineName(name) {
            const map = {
                case_analysis: "案件分析",
                intake_checklist: "补充信息清单",
                cost_estimate: "成本估算",
                success_prediction: "成功率预测",
                local_references: "重庆本地依据",
                final_assembly: "最终组装"
            };
            return map[name] || name;
        },
        buildPayload() {
            const evidence = parseEvidence(this.caseForm.evidenceText);
            const salary = Number(this.caseForm.salary || 0);
            const years = Number(this.caseForm.years || 0);
            return {
                case_type: this.caseForm.case_type || this.inferCaseType(),
                facts: this.caseForm.facts,
                evidence,
                applicant_info: {
                    name: this.caseForm.applicant_name,
                    employer_name: this.caseForm.employer_name,
                    salary
                },
                salary,
                years,
                amount: this.estimateAmount(salary, years),
                contact_name: this.caseForm.contact_name || this.caseForm.applicant_name,
                contact_phone: this.caseForm.contact_phone,
                evidence_quality: evidence.length >= 4 ? "良好" : evidence.length >= 2 ? "一般" : "较弱",
                applicant_background: "普通员工",
                enable_opposition_review: true
            };
        },
        estimateAmount(salary, years) {
            const facts = `${this.caseForm.case_type} ${this.caseForm.goal} ${this.caseForm.facts}`;
            if (!salary) return 0;
            if (/(违法解除|解除|辞退|开除)/.test(facts)) return Math.round(salary * Math.max(years, 1) * 2);
            if (/(工伤|职业病)/.test(facts)) return Math.round(salary * 12);
            if (/(加班)/.test(facts)) return Math.round(salary * Math.max(years, 1));
            if (/(工资|欠薪|劳动报酬)/.test(facts)) return Math.round(salary * 3);
            return Math.round(salary * Math.max(years, 1));
        },
        inferCaseType() {
            const facts = `${this.caseForm.goal} ${this.caseForm.facts}`;
            if (/(违法解除|辞退|开除|解除)/.test(facts)) return "违法解除纠纷";
            if (/(加班)/.test(facts)) return "加班费纠纷";
            if (/(工伤|职业病|受伤)/.test(facts)) return "工伤待遇纠纷";
            if (/(工资|欠薪|劳动报酬)/.test(facts)) return "工资报酬纠纷";
            return "劳动争议";
        },
        applySample(key) {
            const sample = sampleCases[key];
            if (!sample) return;
            this.caseForm = { ...sample };
            this.notice = "已填入示例案情，可以直接开始研判。";
            this.error = "";
        },
        resetWorkspace() {
            this.caseForm = {
                case_type: "",
                goal: "",
                facts: "",
                evidenceText: "",
                applicant_name: "",
                employer_name: "",
                salary: "",
                years: "",
                contact_name: "",
                contact_phone: ""
            };
            this.workup = null;
            this.documentDraft = null;
            this.validation = null;
            this.references = [];
            this.notice = "工作台已重置。";
            this.error = "";
        },
        async withLoading(task) {
            this.loading = true;
            this.notice = "";
            this.error = "";
            try {
                await task();
            } catch (error) {
                const detail = error?.response?.data?.detail || error?.message || "请求失败";
                this.error = String(detail);
            } finally {
                this.loading = false;
            }
        },
        async fetchSession() {
            await this.withLoading(async () => {
                try {
                    const response = await axios.get("/auth/me");
                    this.user = response.data.user;
                    await this.loadWorkspaceData();
                } catch (error) {
                    if (error?.response?.status === 401) {
                        this.user = null;
                        return;
                    }
                    throw error;
                }
            });
        },
        async submitAuth() {
            if (!this.authForm.email || !this.authForm.password) {
                this.error = "请先填写邮箱和密码。";
                return;
            }
            if (this.authMode === "register" && !this.authForm.full_name) {
                this.error = "注册时需要填写姓名。";
                return;
            }
            await this.withLoading(async () => {
                const payload = this.authMode === "login"
                    ? { email: this.authForm.email, password: this.authForm.password }
                    : {
                        email: this.authForm.email,
                        password: this.authForm.password,
                        full_name: this.authForm.full_name,
                        role: this.authForm.role || "案件申请人"
                    };
                const url = this.authMode === "login" ? "/auth/login" : "/auth/register";
                const response = await axios.post(url, payload);
                this.user = response.data.user;
                this.notice = this.authMode === "login" ? "登录成功。" : "注册成功并已进入工作台。";
                await this.loadWorkspaceData();
            });
        },
        async logout() {
            await this.withLoading(async () => {
                await axios.post("/auth/logout");
                this.user = null;
                this.cases = [];
                this.activities = [];
                this.notice = "已退出当前会话。";
            });
        },
        async loadWorkspaceData() {
            await Promise.all([this.loadCases(), this.loadActivities()]);
        },
        async loadCases() {
            if (!this.user) return;
            const response = await axios.get("/workspace/cases");
            this.cases = response.data.items || [];
        },
        async loadActivities() {
            if (!this.user) return;
            const response = await axios.get("/workspace/activities");
            this.activities = response.data.items || [];
        },
        async openCase(id) {
            await this.withLoading(async () => {
                const response = await axios.get(`/workspace/cases/${id}`);
                const snapshot = response.data.snapshot || {};
                if (snapshot.caseForm) this.caseForm = { ...this.caseForm, ...snapshot.caseForm };
                this.workup = snapshot.workup || null;
                this.documentDraft = snapshot.documentDraft || null;
                this.validation = snapshot.validation || null;
                this.references = snapshot.references || [];
                this.selectedDocumentType = snapshot.selectedDocumentType || this.selectedDocumentType;
                this.notice = `已恢复案件：${response.data.title}`;
            });
        },
        async removeCase(id) {
            await this.withLoading(async () => {
                await axios.delete(`/workspace/cases/${id}`);
                await this.loadWorkspaceData();
                this.notice = "案件已删除。";
            });
        },
        async saveCase() {
            if (!this.user) {
                this.error = "请先登录后再保存案件。";
                return;
            }
            if (!this.caseForm.facts.trim()) {
                this.error = "请先输入案情事实。";
                return;
            }
            await this.withLoading(async () => {
                const caseType = this.caseForm.case_type || this.inferCaseType();
                const title = `${caseType} · ${this.caseForm.employer_name || "未命名案件"}`;
                await axios.post("/workspace/cases", {
                    title,
                    case_type: caseType,
                    primary_finding: this.primaryFinding,
                    readiness: this.stageLabel,
                    next_best_action: this.nextBestAction,
                    snapshot: {
                        caseForm: this.caseForm,
                        workup: this.workup,
                        documentDraft: this.documentDraft,
                        validation: this.validation,
                        references: this.referenceItems,
                        selectedDocumentType: this.selectedDocumentType
                    }
                });
                await this.loadWorkspaceData();
                this.notice = "案件已保存到个人空间。";
            });
        },
        async runWorkup() {
            if (!this.caseForm.facts.trim()) {
                this.error = "请先输入案情事实。";
                return;
            }
            await this.withLoading(async () => {
                const response = await axios.post("/arbitration/workup", this.buildPayload());
                this.workup = response.data;
                this.references = response.data.local_references || [];
                if (response.data.suggested_documents?.length) {
                    this.selectedDocumentType = response.data.suggested_documents[0];
                }
                this.notice = "案件研判已完成。";
            });
        },
        async refreshReferences() {
            if (!this.caseForm.facts.trim()) {
                this.error = "请先输入案情事实。";
                return;
            }
            await this.withLoading(async () => {
                const response = await axios.get("/arbitration/local-references", {
                    params: {
                        query: `${this.caseForm.case_type || this.inferCaseType()} ${this.caseForm.facts}`,
                        limit: 5
                    }
                });
                this.references = response.data.references || [];
                this.notice = `已刷新 ${this.references.length} 条重庆本地依据。`;
            });
        },
        async generateDocument() {
            if (!this.caseForm.facts.trim()) {
                this.error = "请先输入案情事实并完成基础研判。";
                return;
            }
            await this.withLoading(async () => {
                const response = await axios.post("/arbitration/generate-document", {
                    document_type: this.selectedDocumentType,
                    case_data: this.buildPayload()
                });
                this.documentDraft = response.data;
                this.notice = `${this.selectedDocumentType} 已生成。`;
            });
        },
        async validateDocument() {
            if (!this.documentDraft?.content) {
                this.error = "请先生成文书草稿。";
                return;
            }
            await this.withLoading(async () => {
                const response = await axios.post("/arbitration/validate-document", {
                    document_type: this.selectedDocumentType,
                    case_data: this.buildPayload(),
                    content: this.documentDraft.content
                });
                this.validation = response.data;
                this.notice = "文书校验已完成。";
            });
        }
    }
}).mount("#app");
</script>
</body>
</html>
